<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>夢幻星球｜chihling</title>
<meta name="theme-color" content="#1a0b26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
/* VOICE: 夢幻、童話、溫柔，像繪本裡的一頁
   IDEA: 一顆可以降落、搭船、和居民說話的手繪星球
   PICTURE: 全螢幕 3D 星球：粉色陸地、藍色海洋、五行城、Who am I 城堡、貓耳頭套幽靈、海中生物與鯤鵬
   COLOUR and TYPE: 深梅紫夜空、粉陸藍海、奶油黃點綴；粉圓體
   LAYOUT: 星球滿版，左上小標題，左下資訊卡，右下降落按鈕／搖桿 */
:root{color-scheme:dark;--cream:#fff4e6;--ink:#3b1d4a;--pink:#ff7fb5;--butter:#ffd36e}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 100%,#7a2d6e 0%,#3a1748 45%,#1a0b26 100%);color:var(--cream);font:16px/1.55 'Huninn','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;top:18px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;text-shadow:0 2px 12px rgba(40,10,50,.6);white-space:nowrap}
#back{position:fixed;top:16px;left:16px;z-index:4;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,244,230,.93);color:var(--ink);box-shadow:0 6px 18px rgba(40,10,50,.35);text-decoration:none}
#back svg{width:24px;height:24px}
#back:focus-visible{outline:3px solid var(--butter);outline-offset:3px}
h1{margin:0;font-size:40px;line-height:1.05;font-weight:400}
.hint{margin:6px 0 0;font-size:14px;opacity:.85}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;background:rgba(255,244,230,.93);color:var(--ink);font-size:13px;padding:4px 11px;border-radius:999px;white-space:nowrap;cursor:pointer;box-shadow:0 4px 14px rgba(40,10,50,.35);transition:opacity .25s;will-change:transform}
.lb.main{background:var(--butter);font-size:15px;padding:5px 13px}
.lb.forest{background:rgba(255,214,231,.9)}
#card{position:fixed;left:16px;bottom:16px;width:min(360px,calc(100% - 32px));max-height:calc(100% - 120px);overflow:auto;background:rgba(255,244,230,.97);color:var(--ink);border-radius:24px;padding:20px;display:none;box-shadow:0 14px 40px rgba(30,5,40,.45)}
#card.on{display:block;animation:pop .28s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
#card h2{font-size:24px;font-weight:400;margin:0 40px 6px 0;line-height:1.2}
#card p{margin:0 0 12px}
#card small{display:block;font-size:13px;opacity:.6;margin:-4px 0 12px}
#card img{width:100%;border-radius:16px;cursor:zoom-in;display:none;margin-bottom:12px}
#card.main img{display:block}
#close{position:absolute;top:12px;right:12px;width:44px;height:44px;padding:0;background:transparent;color:var(--ink);font-size:24px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-size:16px;min-height:44px;padding:0 20px;border-radius:999px;border:0;cursor:pointer;background:var(--pink);color:#fff;display:inline-flex;align-items:center;text-decoration:none}
.alt{background:transparent;color:var(--ink);border:2px solid #eab6cf}
button:focus-visible,.btn:focus-visible,.lb:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
#land{position:fixed;right:20px;bottom:20px;box-shadow:0 8px 24px rgba(255,90,160,.45)}
#hud{position:fixed;top:16px;right:16px;display:none;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 32px)}
#where{background:rgba(255,244,230,.93);color:var(--ink);border-radius:999px;padding:10px 16px;white-space:nowrap}
#boatBtn{background:#5aa7f0}
.zb{width:44px;padding:0;justify-content:center;font-size:22px;background:rgba(255,244,230,.93);color:var(--ink)}
#keys{position:fixed;left:20px;bottom:20px;font-size:14px;opacity:.85;display:none;margin:0}
#joy{position:fixed;right:28px;bottom:28px;width:132px;height:132px;border-radius:50%;background:rgba(255,244,230,.16);border:2px solid rgba(255,244,230,.55);display:none;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,244,230,.9);box-shadow:0 4px 12px rgba(40,10,50,.4)}
#say{position:fixed;left:0;top:0;background:var(--cream);color:var(--ink);padding:8px 14px;border-radius:16px 16px 16px 4px;max-width:240px;font-size:15px;line-height:1.4;box-shadow:0 6px 18px rgba(30,5,40,.4);pointer-events:none;display:none}
#talk{position:fixed;left:50%;top:76px;transform:translateX(-50%);width:min(420px,calc(100% - 32px));background:rgba(255,244,230,.97);color:var(--ink);border-radius:22px;padding:16px 18px;display:none;box-shadow:0 14px 40px rgba(30,5,40,.45)}
#talk p{margin:0 0 10px}
body.walk #hud{display:flex}body.walk #joy,body.walk #keys{display:block}
body.walk #land,body.walk #labels,body.walk #card,body.walk header .hint{display:none}
#lightbox{position:fixed;inset:0;background:rgba(20,6,28,.88);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;z-index:5}
#lightbox.on{display:flex}#lightbox img{max-width:100%;max-height:100%;border-radius:12px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;transition:opacity .6s;pointer-events:none}
@media(max-width:600px){h1{font-size:30px}.hint{font-size:13px}#card{left:12px;bottom:12px;width:calc(100% - 24px)}#land{right:12px;bottom:12px}#hud{top:auto;bottom:176px;right:12px}}
@media(max-width:600px),(hover:none){#keys{display:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="可互動的 3D 夢幻星球"></canvas>
<div id="labels"></div>
<a id="back" href="index.html" aria-label="返回首頁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<header><h1>夢幻星球</h1><p class="hint">拖曳旋轉・滾輪縮放・點城市看看</p></header>
<button id="land">降落探險</button>

<script type="module">
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { THREE, scene, updateWorld, R, V3, clamp, surf, ground, walkable, isOpenSea, C, REGIONS, PLAZA_DIR, PLAT,
  tangentTo, offsetDir, basis, turn, step, frameQuat, HOLE, pickables, player, boats, placeBoat, guards } from './assets/planet.js';
{
// ★ 把這裡換成你「Who am I」作品頁的網址，主城的資訊卡就會出現「前往作品頁」按鈕
const WHO_AM_I_URL = '';
const $ = id => document.getElementById(id);

// ================= 渲染器、相機 =================
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const camera = new THREE.PerspectiveCamera(45, 1, .05, 1000);
camera.position.copy(C.main.dir).multiplyScalar(innerWidth/innerHeight < .8 ? 46 : 32).add(new V3(0,4,0));
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, {enableDamping:true, dampingFactor:.07, enablePan:false, minDistance:R*1.5, maxDistance:R*5, autoRotate:!matchMedia('(prefers-reduced-motion: reduce)').matches, autoRotateSpeed:.3, rotateSpeed:.6});
controls.addEventListener('start', () => { controls.autoRotate = false; fly = null; });
// ================= 標籤 =================
const labelsEl = $('labels');
for (const r of REGIONS){
  const el = document.createElement('div'); el.className = 'lb' + (r.id === 'main' ? ' main' : (r.rad > .25 || r.spot || r.zone) ? ' forest' : '');
  el.textContent = r.name; el.tabIndex = 0; el.setAttribute('role', 'button');
  el.addEventListener('click', () => select(r)); el.addEventListener('keydown', e => { if (e.key === 'Enter') select(r); });
  labelsEl.appendChild(el); r.el = el;
  r.adir = r.labelDir || r.dir; const lift = {main:2.4, tower:3.1, light:2.9, plaza:.9, desert:1.0}[r.id] ?? (r.rad > .25 ? 1.3 : 2.3);
  r.anchor = r.sea ? r.dir.clone().multiplyScalar(R + 2.3) : surf(r.adir, lift);
}
const tv = new V3(), tv2 = new V3();
function updateLabels(){
  const W = innerWidth, H = innerHeight;
  for (const r of REGIONS){ const facing = r.adir.dot(tv2.copy(camera.position).sub(r.anchor).normalize()); tv.copy(r.anchor).project(camera);
    const vis = facing > .12 && tv.z < 1; r.el.style.opacity = vis ? Math.min(1, (facing - .12)*5) : 0; r.el.style.pointerEvents = vis ? 'auto' : 'none';
    r.el.style.transform = `translate(${(tv.x*.5+.5)*W}px,${(-tv.y*.5+.5)*H}px) translate(-50%,-100%)`; }
}

// ================= 選取與飛行 =================
let current = C.main, fly = null;
function select(r){
  current = r; const card = $('card');
  $('cTitle').textContent = r.name; $('cText').textContent = r.desc;
  card.classList.toggle('main', r.id === 'main'); $('cBig').hidden = r.id !== 'main';
  $('cLink').hidden = !(r.id === 'main' && WHO_AM_I_URL); if (WHO_AM_I_URL) $('cLink').href = WHO_AM_I_URL;
  card.classList.remove('on'); void card.offsetWidth; card.classList.add('on');
  controls.autoRotate = false; const from = camera.position.clone();
  fly = {from:from.clone().normalize(), d0:from.length(), d1:Math.max(R*2.3, Math.min(from.length(), R*2.8)), q:new THREE.Quaternion().setFromUnitVectors(from.clone().normalize(), (r.adir || r.dir).clone().add(new V3(0,.25,0)).normalize()), t:0};
}
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e){
  ndc.set(e.clientX/innerWidth*2 - 1, -e.clientY/innerHeight*2 + 1); ray.setFromCamera(ndc, camera); const camDir = camera.position.clone().normalize();
  for (const h of ray.intersectObjects(pickables, true)){ let o = h.object; while (o && !o.userData.region) o = o.parent; if (o && (o.userData.region.adir || o.userData.region.dir).dot(camDir) > .15) return o.userData.region; }
  return null;
}
let down = null, hoverT = 0;
canvas.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY}; });
canvas.addEventListener('pointerup', e => { if (mode !== 'orbit' || !down) return; if (Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6){ const r = pick(e); if (r) select(r); } down = null; });
canvas.addEventListener('pointermove', e => { if (mode !== 'orbit' || e.buttons || e.pointerType !== 'mouse') return; const now = performance.now(); if (now - hoverT < 90) return; hoverT = now; canvas.style.cursor = pick(e) ? 'pointer' : 'grab'; });
$('close').onclick = () => $('card').classList.remove('on');
const lb = $('lightbox'); lb.querySelector('img').src = $('cImg').src;
$('cImg').onclick = $('cBig').onclick = () => lb.classList.add('on'); lb.onclick = () => lb.classList.remove('on');

// ================= 降落行走、搭船、衛兵問話 =================
let mode = 'orbit', lastWhere = '', talking = null, talkTimer = 0;
const keys = {}, joy = {x:0, y:0}, cool = new Map();
function enterWalk(r){
  r = r || current || C.main; mode = 'walk'; document.body.classList.add('walk'); controls.enabled = false; lb.classList.remove('on'); endTalk();
  player.boat = null;
  if (r.id === 'main'){ player.p.copy(PLAZA_DIR); player.f.copy(tangentTo(player.p, C.main.dir)); }
  else if (r.sea){ player.p.copy(offsetDir(r.dir, 0, .06)); player.f.copy(tangentTo(player.p, r.dir)); }
  else if (r.zone){ player.p.copy(r.labelDir); player.f.copy(tangentTo(player.p, C.earth.dir)); }
  else if (r.spot && r.id !== 'plaza'){ player.p.copy(offsetDir(r.dir, .5, .05)); player.f.copy(tangentTo(player.p, r.dir)); }
  else if (r.rad > .25 || r.spot){ player.p.copy(r.dir); player.f.copy(basis(r.dir)[0]); }
  else { player.p.copy(offsetDir(r.dir, 1.2, r.core + .03)); player.f.copy(tangentTo(player.p, r.dir)); }
  if (!walkable(player.p)) player.p.copy(r.sea ? offsetDir(r.dir, 0, .04) : r.dir);
  player.obj.visible = true; lastWhere = '';
}
function exitWalk(){
  mode = 'orbit'; document.body.classList.remove('walk'); player.obj.visible = false; HOLE.uHole.value.z = 0; endTalk(); if (player.boat){ player.boat = null; }
  camera.up.set(0,1,0); camera.position.copy(player.p).multiplyScalar(R*2.6); camera.lookAt(0,0,0); controls.enabled = true; controls.update();
}
$('land').onclick = () => enterWalk(current); $('cLand').onclick = () => enterWalk(current); $('exit').onclick = exitWalk;
let boatAction = null;
function doBoat(){ if (boatAction) boatAction(); }
$('boatBtn').onclick = doBoat;
addEventListener('keydown', e => { if (mode !== 'walk') return; if (e.key === 'Escape'){ exitWalk(); return; } if (e.key.toLowerCase() === 'e'){ doBoat(); return; } keys[e.key.toLowerCase()] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
{ const pad = $('joy'), knob = $('knob'); let id = null;
  const mv = e => { const b = pad.getBoundingClientRect(); let x = (e.clientX - b.left - b.width/2)/(b.width/2), y = (e.clientY - b.top - b.height/2)/(b.height/2); const l = Math.hypot(x, y); if (l > 1){ x /= l; y /= l; } joy.x = x; joy.y = y; knob.style.transform = `translate(${x*38}px,${y*38}px)`; };
  pad.addEventListener('pointerdown', e => { id = e.pointerId; pad.setPointerCapture(id); mv(e); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === id) mv(e); });
  const up = () => { id = null; joy.x = joy.y = 0; knob.style.transform = ''; }; pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up); }
function whereAmI(p){
  if (player.boat) return '海上（搭船中）';
  let best = null, ba = 9; for (const r of REGIONS){ const a = p.angleTo(r.dir), lim = r.sea ? PLAT*1.2 : r.rad*1.1; if (a < lim && a/lim < ba){ ba = a/lim; best = r; } }
  return best ? best.name : '粉紅山脈';
}
// 衛兵對話（示範台詞）
const TALK = {q:'站住！報上名來——你是誰？', a:['旅人啊……那就好好看看這顆星球吧。', '……那就進城去找找答案吧。']};
function startTalk(g){ talking = g; $('say').textContent = TALK.q; $('say').style.display = 'block'; $('talkText').textContent = '衛兵攔住了你：「' + TALK.q + '」'; $('talkBtns').hidden = false; $('talk').style.display = 'block'; talkTimer = 0; }
function endTalk(){ if (talking) cool.set(talking, performance.now() + 20000); talking = null; $('say').style.display = 'none'; $('talk').style.display = 'none'; }
$('talkBtns').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || !talking) return; const r = TALK.a[+b.dataset.a]; $('say').textContent = r; $('talkText').textContent = '衛兵：「' + r + '」'; $('talkBtns').hidden = true; talkTimer = 2.8; });
const camTarget = new V3(), lookAt = new V3(), dbs = new THREE.Vector2();
let camDist = 3.4; const zoomBy = f => { camDist = clamp(camDist*f, 1.4, 9); };
$('zin').onclick = () => zoomBy(.8); $('zout').onclick = () => zoomBy(1.25);
canvas.addEventListener('wheel', e => { if (mode !== 'walk') return; e.preventDefault(); zoomBy(Math.exp(e.deltaY*.0012)); }, {passive:false});
{ const pts = new Map(); let d0 = 0;
  canvas.addEventListener('pointerdown', e => { if (mode === 'walk'){ pts.set(e.pointerId, [e.clientX, e.clientY]); if (pts.size === 2){ const [a, b] = [...pts.values()]; d0 = Math.hypot(a[0]-b[0], a[1]-b[1]); } } });
  canvas.addEventListener('pointermove', e => { if (mode !== 'walk' || !pts.has(e.pointerId)) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2){ const [a, b] = [...pts.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]); if (d0 > 0) zoomBy(d0/d); d0 = d; } });
  const up = e => { pts.delete(e.pointerId); d0 = 0; }; canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up); }
function walk(dt, t){
  const fwd = clamp((keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0) - joy.y, -1, 1);
  const tr = clamp((keys.a || keys.arrowleft ? 1 : 0) - (keys.d || keys.arrowright ? 1 : 0) - joy.x, -1, 1);
  const b = player.boat;
  turn(player.p, player.f, tr*(b ? 1.4 : 2.2)*dt);
  if (Math.abs(fwd) > .05){ const q = player.p.clone(), g = player.f.clone(); step(q, g, fwd*(b ? 3.2 : 1.7)/R*dt);
    if (b ? isOpenSea(q) : walkable(q)){ player.p.copy(q); player.f.copy(g); } }
  const moving = Math.abs(fwd) > .05;
  if (b){ b.p.copy(player.p); b.f.copy(player.f); placeBoat(b, t); player.obj.position.copy(player.p).multiplyScalar(R + .06); frameQuat(player.obj, player.p, player.f); }
  else { player.obj.position.copy(player.p).multiplyScalar(R + ground(player.p) + .01 + (moving ? Math.abs(Math.sin(t*9))*.04 : 0)); frameQuat(player.obj, player.p, player.f); player.obj.rotateZ(moving ? Math.sin(t*9)*.08 : 0); }
  // 上船／下船
  boatAction = null; let label = '';
  if (b){ for (const a of [0, .6, -.6, 1.2, -1.2]){ const q = player.p.clone(), g = player.f.clone(); turn(q, g, a); step(q, g, .05); if (walkable(q)){ label = '下船（E）'; boatAction = () => { player.boat = null; player.p.copy(q); player.f.copy(g); }; break; } } }
  else { const nb = boats.find(x => !x.npc && x.p.angleTo(player.p) < .07); if (nb){ label = '上船（E）'; boatAction = () => { player.boat = nb; player.p.copy(nb.p); player.f.copy(nb.f); endTalk(); }; } }
  $('boatBtn').hidden = !boatAction; if (label) $('boatBtn').textContent = label;
  // 衛兵問話
  if (!talking && !b){ const now = performance.now(); for (const g of guards){ if ((cool.get(g) || 0) < now && g.p.angleTo(player.p) < .045){ startTalk(g); break; } } }
  if (talking){ const g = talking; g.f.lerp(tangentTo(g.p, player.p), Math.min(1, dt*6)).normalize();
    tv.copy(g.obj.position).addScaledVector(g.p, .6).project(camera); $('say').style.transform = `translate(${(tv.x*.5+.5)*innerWidth}px,${(-tv.y*.5+.5)*innerHeight}px) translate(-20%,-100%)`;
    if (talkTimer > 0 && (talkTimer -= dt) <= 0) endTalk(); else if (g.p.angleTo(player.p) > .1) endTalk(); }
  // 相機跟隨
  const base = player.obj.position.clone(), dist = camDist*(b ? 1.35 : 1), back = dist, high = dist*.62 + .3;
  camTarget.copy(base).addScaledVector(player.p, high).addScaledVector(player.f, -back);
  { const cd = camTarget.clone().normalize(), minR = R + Math.max(ground(cd), 0) + .45; if (camTarget.length() < minR) camTarget.copy(cd).multiplyScalar(minR); } // 鏡頭不鑽進山裡
  const k = 1 - Math.exp(-dt*4); camera.position.lerp(camTarget, k); camera.up.lerp(player.p, k).normalize();
  lookAt.copy(base).addScaledVector(player.p, .45).addScaledVector(player.f, .9); camera.lookAt(lookAt);
  // 透視窗：擋在鏡頭和角色之間的東西，在角色周圍淡出
  camera.updateMatrixWorld(); tv.copy(base).addScaledVector(player.p, .25); const vz = -tv.clone().applyMatrix4(camera.matrixWorldInverse).z; tv.project(camera);
  renderer.getDrawingBufferSize(dbs); HOLE.uHole.value.set((tv.x*.5 + .5)*dbs.x, (tv.y*.5 + .5)*dbs.y, dbs.y*.17*Math.min(1.6, 3/Math.max(dist, 1))); HOLE.uHoleDepth.value = vz - .35;
  const w = whereAmI(player.p); if (w !== lastWhere){ lastWhere = w; $('where').textContent = '目前位置：' + w; }
}

// ================= 動畫迴圈 =================
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock(), lightOff = new V3(14, 22, 6);
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (mode === 'orbit'){
    if (fly){ fly.t = Math.min(1, fly.t + dt/1.3); const e = fly.t < .5 ? 2*fly.t*fly.t : 1 - (-2*fly.t + 2)**2/2;
      camera.position.copy(fly.from).applyQuaternion(new THREE.Quaternion().slerp(fly.q, e)).multiplyScalar(fly.d0 + (fly.d1 - fly.d0)*e); if (fly.t >= 1) fly = null; }
    controls.update(); updateLabels();
  } else walk(dt, t);
  updateWorld(dt, t, camera.position);
  renderer.render(scene, camera);
  if (!window.__ok){ window.__ok = true; const l = $('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 700); }
});
}
</script>
